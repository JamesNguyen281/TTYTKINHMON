name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WebsiteCore/WebsiteCore.sln

      - name: Build
        run: dotnet build WebsiteCore/WebsiteCore.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WebsiteCore/WebsiteCore.sln --configuration Release --no-build --verbosity normal
