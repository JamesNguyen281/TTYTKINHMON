services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ttytkm-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Strong!Pass2026"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - ttytkm_sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Strong!Pass2026' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ttytkm-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=ttytlp;User Id=sa;Password=Strong!Pass2026;TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "5050:8080"

volumes:
  ttytkm_sqldata:
