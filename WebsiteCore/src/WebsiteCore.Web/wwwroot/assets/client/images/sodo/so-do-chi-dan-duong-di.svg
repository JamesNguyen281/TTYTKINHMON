<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe7fa"/>
      <stop offset="100%" stop-color="#a3d3f5"/>
    </linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f78d1"/>
      <stop offset="100%" stop-color="#0a3d62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="800" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="0" y="0" width="1000" height="120" fill="url(#hd)"/>
  <text x="500" y="50" font-family="Arial, sans-serif" font-size="22" font-weight="700"
        fill="white" text-anchor="middle">TRUNG TÂM Y TẾ THỊ XÃ KINH MÔN</text>
  <text x="500" y="92" font-family="Arial, sans-serif" font-size="42" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="2">SƠ ĐỒ CHỈ DẪN ĐƯỜNG ĐI</text>

  <!-- North arrow -->
  <polygon points="500,160 580,260 540,260 540,360 460,360 460,260 420,260" fill="#1f78d1" filter="url(#shadow)"/>
  <text x="500" y="220" font-family="Arial, sans-serif" font-size="20" font-weight="700"
        fill="white" text-anchor="middle">HƯỚNG ĐI</text>
  <text x="500" y="280" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">+ Khoa Hồi sức cấp cứu</text>
  <text x="500" y="298" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">+ Khoa RHM - TMH - Mắt</text>
  <text x="500" y="316" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">+ Khoa Nội tổng hợp</text>
  <text x="500" y="334" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">+ Khoa YHCT - PHCN</text>

  <!-- West arrow -->
  <polygon points="80,400 200,330 200,370 320,370 320,430 200,430 200,470" fill="#1f78d1" filter="url(#shadow)"/>
  <text x="200" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="700"
        fill="white" text-anchor="middle">HƯỚNG ĐI</text>
  <text x="200" y="395" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Cổng số 2 - Nhà A</text>
  <text x="200" y="413" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">+ Khoa Khám bệnh</text>
  <text x="200" y="431" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">+ Khoa Xét nghiệm - CĐHA</text>

  <!-- East arrow -->
  <polygon points="920,400 800,330 800,370 680,370 680,430 800,430 800,470" fill="#1f78d1" filter="url(#shadow)"/>
  <text x="800" y="365" font-family="Arial, sans-serif" font-size="20" font-weight="700"
        fill="white" text-anchor="middle">HƯỚNG ĐI</text>
  <text x="800" y="395" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Nhà E</text>
  <text x="800" y="413" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">+ Hội trường - Giao ban</text>
  <text x="800" y="431" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">+ Khu hành chính</text>
  <text x="800" y="449" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">+ Khoa Dược - VTYT</text>

  <!-- Center compass -->
  <circle cx="500" cy="400" r="80" fill="white" stroke="#1f78d1" stroke-width="3" filter="url(#shadow)"/>
  <polygon points="500,340 510,395 500,460 490,395" fill="#1f78d1"/>
  <polygon points="440,400 495,390 560,400 495,410" fill="#1f78d1"/>
  <text x="500" y="405" font-family="Arial, sans-serif" font-size="14" font-weight="700"
        fill="#0a3d62" text-anchor="middle">ĐI THEO</text>
  <text x="500" y="423" font-family="Arial, sans-serif" font-size="14" font-weight="700"
        fill="#0a3d62" text-anchor="middle">HƯỚNG MŨI TÊN</text>

  <!-- South arrow -->
  <polygon points="500,640 580,540 540,540 540,440 460,440 460,540 420,540" fill="#1f78d1" filter="url(#shadow)"/>
  <text x="500" y="600" font-family="Arial, sans-serif" font-size="20" font-weight="700"
        fill="white" text-anchor="middle">HƯỚNG ĐI</text>
  <text x="500" y="630" font-family="Arial, sans-serif" font-size="13" fill="white" text-anchor="middle">Cổng chính số 1</text>

  <!-- Footer -->
  <text x="500" y="710" font-family="Arial, sans-serif" font-size="14" fill="#06283d" text-anchor="middle"
        font-style="italic">⓿ Ảnh placeholder — admin upload ảnh thật vào /assets/client/images/sodo/so-do-chi-dan-duong-di.jpg</text>
  <text x="500" y="740" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0a3d62" text-anchor="middle">
    294 Trần Hưng Đạo, phường Kinh Môn, TP Hải Phòng · ĐDN 0964.801.616 · Cấp cứu 02203.822.205
  </text>
</svg>
